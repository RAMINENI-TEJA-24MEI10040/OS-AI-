<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenTrace AI — Cyber Investigation Agent</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0ea5e9',
              600: '#0284c7',
              900: '#075985',
              950: '#0c4a6e',
            },
            cyber: {
              bg: '#090d16',
              card: '#111827',
              border: '#1f2937',
              accent: '#38bdf8',
              success: '#10b981',
              warning: '#f59e0b',
              danger: '#ef4444',
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  
  <!-- Custom Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  
  <!-- React 18 Production Build -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body class="bg-cyber-bg text-slate-100 font-sans min-h-screen selection:bg-brand-500 selection:text-white antialiased">
  <div id="root"></div>

  <!-- Pure JavaScript Application Script (No Babel compilation required) -->
  <script src="/static/app.js"></script>
</body>
</html>
