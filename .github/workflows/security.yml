name: Security & Test Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit pytest

      - name: Dependency Vulnerability Audit (A03:2025)
        run: |
          pip-audit --ignore-code 1

      - name: Run OpenTrace AI Security & Verification Test Suite
        run: |
          python backend/test_suite.py
